<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Keepii - Workspace & Mini Bot</title>
  <style>
    /* =========================================
       1. KHÔNG GIAN APPS CHÍNH CỦA USER 
       ========================================= */
    body {
      margin: 0;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: pan-y;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    #user-dashboard {
      position: absolute;
      top: 60px; 
      left: 0;
      width: 100%;
      height: calc(100vh - 60px);
      box-sizing: border-box;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow: hidden;
    }

    .infinite-text-pad {
      width: 100%;
      min-height: 80px;
      max-height: 150px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      padding: 12px;
      box-sizing: border-box;
      outline: none;
      font-size: 16px;
      overflow-y: auto;
      white-space: pre-wrap;
      transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }
    .infinite-text-pad:focus {
      border-color: #06b6d4;
      background: rgba(255, 255, 255, 0.12);
    }

    #notes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); 
      gap: 15px;
      height: calc(100% - 170px); 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch;
      padding-bottom: 100px; 
      box-sizing: border-box;
    }
    
    .note-card {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(79, 70, 229, 0.15));
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 12px;
      height: 130px;
      padding: 12px;
      box-sizing: border-box;
      color: #fff;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: transform 0.4s cubic-bezier(0.25, 1.5, 0.5, 1), background 0.4s ease, border 0.4s ease, color 0.4s ease;
    }
    .note-card:active { transform: scale(0.94); }
    
    .note-card-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      color: #06b6d4;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      transition: color 0.4s ease;
    }
    .note-card-body {
      font-size: 13px;
      opacity: 0.8;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.4s ease;
    }

    /* Fullscreen Editor */
    .fullscreen-note-container {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 6000; 
      background: #090915;
      box-sizing: border-box;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: background 0.4s ease;
    }
    .fullscreen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 40px;
    }
    .fullscreen-title { color: #06b6d4; font-weight: bold; font-size: 16px; }
    .close-edit-btn {
      background: #ef4444; color: white; padding: 6px 16px;
      border-radius: 20px; font-weight: bold; font-size: 13px;
      cursor: pointer; transition: transform 0.3s;
    }
    .close-edit-btn:active { transform: scale(0.88); }
    .fullscreen-editor {
      width: 100%; flex: 1; 
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 15px; box-sizing: border-box;
      outline: none; color: #fff; font-size: 16px; resize: none;
      transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }

    /* Bottom Controls */
    .bottom-controls-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 1005;
    }
    #add-note-btn {
      width: 55px; height: 55px; border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #4f46e5); color: white;
      font-size: 30px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
    }
    #add-note-btn:active { transform: scale(0.85); }

    /* Type Popup */
    #type-popup-mask {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 4500; display: flex;
      align-items: center; justify-content: center; opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #type-popup-mask.open { opacity: 1; pointer-events: auto; }
    .type-popup-box {
      background: #151525; border: 2px solid #06b6d4; border-radius: 16px;
      padding: 25px; width: 85%; max-width: 320px; text-align: center;
      transform: scale(0.6); transition: transform 0.5s, background 0.4s ease, border-color 0.4s ease;
    }
    #type-popup-mask.open .type-popup-box { transform: scale(1); }
    .popup-title { color: #fff; font-weight: bold; margin-bottom: 15px; transition: color 0.4s ease; }
    .type-option-btn {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
      color: #fff; font-weight: bold; cursor: pointer; text-align: left;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    /* Avatar & Menu */
    #user-avatar-container { position: fixed; top: 15px; right: 20px; z-index: 5000; }
    .avatar-circle-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #4f46e5); color: white;
      font-weight: bold; display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: 2px solid rgba(255,255,255,0.2);
    }
    .info-drawer-panel {
      position: absolute; top: 50px; right: 0; background: #111122;
      border: 1px solid rgba(6, 182, 212, 0.3); border-radius: 12px;
      padding: 15px; min-width: 160px; box-sizing: border-box;
      opacity: 0; pointer-events: none; transform: translateY(-15px) scale(0.9);
      transition: all 0.3s ease, background 0.4s ease, border-color 0.4s ease;
    }
    .info-drawer-panel.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
    .drawer-greeting { font-weight: bold; color: #06b6d4; margin-bottom: 12px; }
    
    .drawer-btn {
      width: 100%; padding: 10px 0; border-radius: 18px; font-weight: bold;
      font-size: 13px; text-align: center; cursor: pointer; margin-top: 8px;
      color: white; transition: transform 0.25s;
    }
    .drawer-btn:active { transform: scale(0.92); }
    .drawer-bot-btn { background: #4f46e5; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25); }
    .drawer-logout-btn { background: #ef4444; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.25); }

    /* =========================================
       2. TÍNH NĂNG MINI BOT GÓC MÀN HÌNH
       ========================================= */
    #mini-bot-wrapper {
      position: fixed;
      top: 80px; left: 20px;
      width: clamp(200px, 25vw, 300px);
      height: 180px;
      z-index: 5500;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .bot-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      width: 100%;
      justify-content: center;
    }
    .bot-tool-btn {
      background: rgba(12, 14, 23, 0.85);
      border: 1px solid #00f2fe;
      color: #00f2fe;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.2s, transform 0.1s;
    }
    .bot-tool-btn:active { transform: scale(0.9); }
    .bot-tool-btn.active-drag { background: #00f2fe; color: #000; }

    .chat-bubble {
      position: absolute;
      top: -45px;
      background: white;
      color: black;
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      max-width: 200px;
      width: max-content;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      transform: translateY(10px) scale(0.9);
      z-index: 10;
    }
    .chat-bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .chat-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: white transparent transparent transparent;
    }

    /* Đã dịch chuyển lệch sang phải (right: -55px) để không bị vướng khung bot */
    .emotions-menu {
      position: absolute;
      top: -40px;
      right: -55px;
      background: #111122;
      border: 1px solid #00f2fe;
      border-radius: 12px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
      z-index: 6000;
      transition: background 0.4s ease, border-color 0.4s ease;
    }
    .emo-item {
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s;
      text-align: center;
    }
    .emo-item:active { transform: scale(1.3); }

    .bot-avatar-card {
      position: relative;
      width: 100%;
      height: 120px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #060709;
      --led-color1: #00f2fe;
      --led-color2: #4facfe;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
      cursor: pointer;
    }
    .bot-avatar-card::before {
      content: ''; position: absolute; width: 150%; height: 300%;
      background: linear-gradient(0deg, transparent, var(--led-color1), var(--led-color2));
      animation: rotateBorder 3.5s linear infinite;
    }
    .bot-face-inner {
      position: absolute; inset: 4px; background: #0c0e17;
      border-radius: 16px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 15px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
    }
    .eyes-container { display: flex; gap: 30px; align-items: center; height: 25px; }
    .eye {
      width: 25px; height: 25px; background-color: #ffffff;
      border-radius: 50%; box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transition: height 0.2s, width 0.2s, border-radius 0.2s, background-color 0.3s;
    }
    .mouth {
      width: 25px; height: 8px; background-color: var(--led-color1);
      border-radius: 0 0 20px 20px; transition: transform 0.05s, height 0.2s, border-radius 0.3s;
      box-shadow: 0 0 10px var(--led-color1);
    }
    @keyframes rotateBorder { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 6 cảm xúc cho Bot */
    .bot-avatar-card[data-emotion="happy"] { --led-color1: #00ff88; --led-color2: #00b894; }
    .bot-avatar-card[data-emotion="happy"] .eye { height: 10px; border-radius: 10px 10px 0 0; }
    .bot-avatar-card[data-emotion="happy"] .mouth { border-radius: 0 0 20px 20px; height: 12px; width: 30px; }
    
    .bot-avatar-card[data-emotion="sleepy"] { --led-color1: #a29bfe; --led-color2: #6c5ce7; }
    .bot-avatar-card[data-emotion="sleepy"] .eye { width: 22px; height: 4px; border-radius: 2px; opacity: 0.6; }
    .bot-avatar-card[data-emotion="sleepy"] .mouth { width: 10px; height: 10px; border-radius: 50%; opacity: 0.8; }
    
    .bot-avatar-card[data-emotion="angry"] { --led-color1: #ff3838; --led-color2: #ff4d4d; }
    .bot-avatar-card[data-emotion="angry"] .eye { height: 15px; border-radius: 50% 50% 5px 5px; }
    .bot-avatar-card[data-emotion="angry"] .eye::before {
      content: ''; position: absolute; top: -6px; left: -5px; right: -5px; height: 12px;
      background: #0c0e17; transform: rotate(25deg);
    }
    .bot-avatar-card[data-emotion="angry"] .eye:last-child::before { transform: rotate(-25deg); }
    .bot-avatar-card[data-emotion="angry"] .mouth { border-radius: 10px 10px 5px 5px; height: 6px; width: 20px; }

    .bot-avatar-card[data-emotion="surprised"] { --led-color1: #f1c40f; --led-color2: #f39c12; }
    .bot-avatar-card[data-emotion="surprised"] .eye { width: 18px; height: 18px; }
    .bot-avatar-card[data-emotion="surprised"] .mouth { width: 14px; height: 14px; border-radius: 50%; }

    .bot-avatar-card[data-emotion="thinking"] { --led-color1: #3498db; --led-color2: #2980b9; }
    .bot-avatar-card[data-emotion="thinking"] .eye { width: 20px; height: 12px; border-radius: 6px; }
    .bot-avatar-card[data-emotion="thinking"] .mouth { width: 18px; height: 4px; border-radius: 2px; }

    .bot-avatar-card.talking .mouth { transform: scaleY(var(--mouth-scale, 1)); }
    .bot-avatar-card.blinking .eye { transform: scaleY(0.1) !important; }

    /* =========================================
       3. HỖ TRỢ CHẾ ĐỘ SÁNG (LIGHT MODE STYLES)
       ========================================= */
    body.light-mode .infinite-text-pad {
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.15);
      color: #101026;
    }
    body.light-mode .infinite-text-pad:focus {
      border-color: #06b6d4;
      background: rgba(0, 0, 0, 0.07);
    }
    body.light-mode .note-card {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(79, 70, 229, 0.1));
      border: 1px solid rgba(6, 182, 212, 0.25);
      color: #101026;
    }
    body.light-mode .note-card-title { color: #0284c7; }
    body.light-mode .note-card-body { color: #333; }
    body.light-mode .type-popup-box,
    body.light-mode .info-drawer-panel,
    body.light-mode .emotions-menu {
      background: #ffffff;
      border-color: #06b6d4;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    body.light-mode .popup-title,
    body.light-mode .type-option-btn { color: #101026; }
    body.light-mode .type-option-btn {
      background: rgba(0,0,0,0.03);
      border: 1px solid rgba(0,0,0,0.1);
    }
    body.light-mode .fullscreen-note-container {
      background: #ffffff;
    }
    body.light-mode .fullscreen-editor {
      background: rgba(0,0,0,0.02);
      border: 1px solid rgba(0,0,0,0.1);
      color: #101026;
    }
  </style>
</head>
<body>

  <!-- Menu góc trên bên phải -->
  <div id="user-avatar-container">
    <div class="avatar-circle-btn" onclick="toggleUserDrawer(event)" id="avtLetter">U</div>
    <div class="info-drawer-panel" id="userDrawerPanel">
      <div class="drawer-greeting" id="drawerWelcomeTxt">Xin chào!</div>
      <div class="drawer-btn drawer-bot-btn" onclick="toggleMiniBot()">🤖 Triệu hồi Bot</div>
      <div class="drawer-btn drawer-logout-btn" onclick="userLogout()">Đăng xuất</div>
    </div>
  </div>

  <!-- Bảng điều khiển công việc -->
  <div id="user-dashboard">
    <div class="infinite-text-pad" contenteditable="true" placeholder="Gõ ghi chú nhanh tại đây..." id="infinitePad"></div>
    <div id="notes-grid"></div>
  </div>

  <div class="bottom-controls-bar">
    <div id="add-note-btn" onclick="openTypePopup()">+</div>
  </div>

  <!-- Popup tạo ghi chú -->
  <div id="type-popup-mask" onclick="closeTypePopup()">
    <div class="type-popup-box" onclick="event.stopPropagation()">
      <div class="popup-title">Tạo một ghi chú mới</div>
      <div class="type-option-btn" onclick="createNewTextNote()">📝 Ghi chú văn bản</div>
    </div>
  </div>

  <!-- =========================================
       MODULE: MINI BOT FLOAT CONTAINER
       ========================================= -->
  <div id="mini-bot-wrapper">
    <div class="chat-bubble" id="botChatBubble">Xin chào!</div>
    
    <!-- 6 cảm xúc cho Bot -->
    <div class="emotions-menu" id="emoMenu">
      <div class="emo-item" onclick="setBotEmotion('normal', 'Bình thường thôi')">😐</div>
      <div class="emo-item" onclick="setBotEmotion('happy', 'Tuyệt quá!')">😀</div>
      <div class="emo-item" onclick="setBotEmotion('sleepy', 'Buồn ngủ quá...')">😴</div>
      <div class="emo-item" onclick="setBotEmotion('angry', 'Đang bực mình!')">😡</div>
      <div class="emo-item" onclick="setBotEmotion('surprised', 'Ồ, bất ngờ ghê!')">😲</div>
      <div class="emo-item" onclick="setBotEmotion('thinking', 'Đang suy nghĩ...')">🤔</div>
    </div>
    
    <div class="bot-controls">
      <div class="bot-tool-btn" id="dragToggleBtn" onclick="toggleDragMode(event)">📍 Di chuyển</div>
      <div class="bot-tool-btn" onclick="toggleEmotionsMenu(event)">😀 Cảm xúc</div>
    </div>

    <!-- Khuôn mặt Bot -->
    <div class="bot-avatar-card" id="miniBotCard" data-emotion="normal">
      <div class="bot-face-inner">
        <div class="eyes-container">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth"></div>
      </div>
    </div>
  </div>

  <script>
    function getUsernameFromCookie() {
      const match = document.cookie.match(new RegExp('(^| )user_session=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : 'guest';
    }

    let currentUser = getUsernameFromCookie(); 
    let userNotes = [];
    let savedInfiniteText = "";
    const CLOUD_URL = "https://keepii-vn.onrender.com/api";
    let saveTimeout = null;

    function syncUserData() {
      currentUser = getUsernameFromCookie();
      const cachedNotes = localStorage.getItem(`keepii_notes_${currentUser}`);
      const cachedInf = localStorage.getItem(`keepii_inf_text_${currentUser}`);
      
      if (cachedNotes) userNotes = JSON.parse(cachedNotes);
      if (cachedInf) {
        savedInfiniteText = cachedInf;
        const pad = document.getElementById('infinitePad');
        if(pad) pad.innerText = savedInfiniteText;
      }
      renderNotes();
      
      const avtLetter = document.getElementById('avtLetter');
      const welcomeTxt = document.getElementById('drawerWelcomeTxt');
      if(avtLetter && currentUser) avtLetter.textContent = currentUser.charAt(0).toUpperCase();
      if(welcomeTxt) welcomeTxt.textContent = `Xin chào, ${currentUser}!`;
    }

    async function saveUserDataToCloud() {
      if (!currentUser || currentUser === 'guest') return;
      try {
        await fetch(`${CLOUD_URL}/save_user_data`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nickname: currentUser,
            notes: userNotes,
            inf_text: savedInfiniteText
          })
        });
      } catch (error) {
        console.error("❌ Đồng bộ đám mây thất bại:", error);
      }
    }

    function triggerAutoSave() {
      if (currentUser === 'guest') return;
      localStorage.setItem(`keepii_notes_${currentUser}`, JSON.stringify(userNotes));
      localStorage.setItem(`keepii_inf_text_${currentUser}`, savedInfiniteText);

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        saveUserDataToCloud();
      }, 3000);
    }

    const infPad = document.getElementById('infinitePad');
    if(infPad) {
      infPad.addEventListener('input', () => {
        savedInfiniteText = infPad.innerText;
        triggerAutoSave(); 
      });
    }

    window.toggleUserDrawer = function(e) {
      e.stopPropagation();
      document.getElementById('userDrawerPanel').classList.toggle('open');
    };
    document.addEventListener('click', () => {
      const panel = document.getElementById('userDrawerPanel');
      if(panel) panel.classList.remove('open');
    });

    function renderNotes() {
      const grid = document.getElementById('notes-grid');
      if(!grid) return;
      grid.innerHTML = '';
      userNotes.forEach((note, index) => {
        const card = document.createElement('div');
        card.className = 'note-card';
        card.onclick = () => openFullscreenNote(index);
        card.innerHTML = `
          <div class="note-card-title">Ghi chú #${index + 1}</div>
          <div class="note-card-body">${note ? note.replace(/\n/g, '<br>') : 'Trống...'}</div>
        `;
        grid.appendChild(card);
      });
    }

    window.openTypePopup = function() { document.getElementById('type-popup-mask').classList.add('open'); }
    window.closeTypePopup = function() { document.getElementById('type-popup-mask').classList.remove('open'); }
    window.createNewTextNote = function() {
      userNotes.push(""); 
      closeTypePopup(); renderNotes(); triggerAutoSave();
      openFullscreenNote(userNotes.length - 1);
    }

    window.openFullscreenNote = function(index) {
      const isLight = document.body.classList.contains('light-mode');
      const fsContainer = document.createElement('div');
      fsContainer.id = 'active-fullscreen-editor';
      fsContainer.className = 'fullscreen-note-container';
      if(isLight) fsContainer.style.background = "#ffffff";
      fsContainer.innerHTML = `
        <div class="fullscreen-header">
          <div class="fullscreen-title">CHỈNH SỬA GHI CHÚ #${index + 1}</div>
          <div class="close-edit-btn" onclick="closeFullscreenNote(${index})">Thoát ✕</div>
        </div>
        <textarea class="fullscreen-editor" id="editor-${index}">${userNotes[index]}</textarea>
      `;
      document.body.appendChild(fsContainer);
      const textarea = document.getElementById(`editor-${index}`);
      textarea.focus();
      textarea.addEventListener('input', (e) => {
        userNotes[index] = e.target.value;
        triggerAutoSave();
      });
    }

    window.closeFullscreenNote = function(index) {
      saveUserDataToCloud();
      const el = document.getElementById('active-fullscreen-editor');
      if(el) el.remove();
      renderNotes();
    };

    window.userLogout = function() {
      document.cookie = "user_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      location.reload();
    };

    /* =========================================
       PHẦN 2: LOGIC MINI BOT (SSPRO MODULE)
       ========================================= */
    const botWrapper = document.getElementById('mini-bot-wrapper');
    const botCard = document.getElementById('miniBotCard');
    const chatBubble = document.getElementById('botChatBubble');
    const emoMenu = document.getElementById('emoMenu');
    const dragToggleBtn = document.getElementById('dragToggleBtn');
    
    let isBotActive = false;
    let isDragMode = false;
    let isDragging = false;
    let dragOffsetX, dragOffsetY;
    let chatTimer;

    window.toggleMiniBot = function() {
      isBotActive = !isBotActive;
      if(botWrapper) botWrapper.style.display = isBotActive ? 'flex' : 'none';
      if(isBotActive) botSpeak("Xin chào! Mình là Bot hỗ trợ đây.", "happy");
    };

    window.toggleEmotionsMenu = function(e) {
      e.stopPropagation();
      emoMenu.style.display = emoMenu.style.display === 'flex' ? 'none' : 'flex';
    };
    
    window.setBotEmotion = function(emo, text) {
      botCard.setAttribute('data-emotion', emo);
      botSpeak(text, emo);
      emoMenu.style.display = 'none';
    };

    function botSpeak(text, emotion = "normal") {
      botCard.setAttribute('data-emotion', emotion);
      chatBubble.innerText = text;
      chatBubble.classList.add('show');
      
      botCard.classList.add('talking');
      let talkInterval = setInterval(() => {
        botCard.style.setProperty('--mouth-scale', 0.6 + Math.random() * 1.3);
      }, 80);

      clearTimeout(chatTimer);
      chatTimer = setTimeout(() => {
        chatBubble.classList.remove('show');
        clearInterval(talkInterval);
        botCard.classList.remove('talking');
        botCard.style.setProperty('--mouth-scale', 1);
        botCard.setAttribute('data-emotion', 'normal');
      }, 3500);
    }

    setInterval(() => {
      if (botCard && !botCard.classList.contains('talking')) {
        botCard.classList.add('blinking');
        setTimeout(() => botCard.classList.remove('blinking'), 150);
      }
    }, Math.random() * 4000 + 2000);

    window.toggleDragMode = function(e) {
      e.stopPropagation();
      isDragMode = !isDragMode;
      dragToggleBtn.classList.toggle('active-drag', isDragMode);
      if(isDragMode) botSpeak("Bế mình đi đâu thế?", "surprised");
    };

    if(botWrapper) {
      botWrapper.addEventListener('pointerdown', (e) => {
        if (!isDragMode) return;
        isDragging = true;
        const rect = botWrapper.getBoundingClientRect();
        dragOffsetX = e.clientX - rect.left;
        dragOffsetY = e.clientY - rect.top;
        botWrapper.setPointerCapture(e.pointerId);
      });

      botWrapper.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        botWrapper.style.top = `${e.clientY - dragOffsetY}px`;
        botWrapper.style.left = `${e.clientX - dragOffsetX}px`;
        botWrapper.style.right = 'auto';
        botWrapper.style.bottom = 'auto';
      });

      botWrapper.addEventListener('pointerup', (e) => {
        if(!isDragging) return;
        isDragging = false;
        botWrapper.releasePointerCapture(e.pointerId);
      });
    }

    let touchTimer = null;
    let isLongPress = false;

    if(botCard) {
      botCard.addEventListener('pointerdown', (e) => {
        if (isDragMode || e.target.closest('.bot-controls') || e.target.closest('.emotions-menu')) return;
        isLongPress = false;
        touchTimer = setTimeout(() => {
          isLongPress = true;
          botSpeak("Thích quá, xoa đầu nữa đi!", "happy");
        }, 700);
      });

      botCard.addEventListener('pointerup', (e) => {
        if (isDragMode || e.target.closest('.bot-controls')) return;
        clearTimeout(touchTimer);
        if (!isLongPress) {
          const reactions = [
            { text: "Ui! Đừng chọc mình!", emo: "surprised" },
            { text: "Mình đang xem bạn ghi chú nè.", emo: "normal" },
            { text: "Đang phân tích dữ liệu...", emo: "thinking" }
          ];
          const res = reactions[Math.floor(Math.random() * reactions.length)];
          botSpeak(res.text, res.emo);
        }
      });
    }

    syncUserData();
  </script>
</body>
</html>
